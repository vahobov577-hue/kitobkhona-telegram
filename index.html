  try{j=await r.json()}catch(e){}

  return {text:j.text}};

})();

function cardsFromPage(){var b=bk(S.b);msg("ИИ карточка месозад…");genCards(b,S.pg,S.pg,6).then(function(n){msg("Илова шуд: "+n+" карточка")}).catch(function(e){msg(e&&e.code=="empty"?"Дар ин саҳифа матн кам аст":errTxt(e))})}
function chapterSummary(){var b=bk(S.b),toc=(b.toc||[]).filter(function(e){return e[0]==1}),s=0,e2=N(b)-1,title="Боб",i;for(i=0;i<toc.length;i++){if(toc[i][2]<=S.pg){s=toc[i][2];title=toc[i][1];e2=toc[i+1]?toc[i+1][2]-1:N(b)-1}}if(!toc.length){s=Math.max(0,S.pg-3);e2=Math.min(N(b)-1,S.pg+3)}
 sendAI("Сделай конспект главы «"+title+"»: 1) заголовок, 2) 6–8 ключевых пунктов, 3) важные термины с короткими определениями, 4) наглядную SVG-схему (mind-map) главной идеи. Опирайся на фрагменты и ссылайся на страницы [саҳ. N].","Конспекти боб",gather(b,s,Math.min(e2,s+11),9000))}
document.addEventListener("pointerdown",function(e){if(e.target.closest&&e.target.closest(".seltb"))e.preventDefault();DX=e.clientX;DY=e.clientY;if(S.snd&&PF)ensureAC()});
document.addEventListener("pointerup",function(e){
 if(!PF||!e.target.closest||!e.target.closest("#zw"))return;
 if(Math.abs(e.clientX-DX)+Math.abs(e.clientY-DY)>20)return;
 var now=Date.now();
 if(now-LT<350&&Math.abs(e.clientX-LX)+Math.abs(e.clientY-LY)<40){LT=0;toggleCtl()}else{LT=now;LX=e.clientX;LY=e.clientY}});
document.addEventListener("keydown",function(e){if(e.target.id=="aiin"&&e.key=="Enter"&&!e.shiftKey){e.preventDefault();sendAI(e.target.value);return}if(!PF)return;if(e.target.id=="sq"&&e.key=="Enter")doSearch();if(e.key=="ArrowRight"&&!e.target.id)PF.flipNext();if(e.key=="ArrowLeft"&&!e.target.id)PF.flipPrev()});
if(TG){try{TG.ready();TG.expand();if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();if(TG.setHeaderColor)TG.setHeaderColor("#1b3a6b");
 TG.BackButton.onClick(function(){if(SHK){closeSheet()}else if(document.getElementById("pnl")){closePanel()}else if(S.v=="read"){S.v="lib";draw()}});
 setInterval(function(){try{(S.v=="read"||SHK||document.getElementById("pnl"))?TG.BackButton.show():TG.BackButton.hide()}catch(x){}},400)}catch(x){}}
load();if(TG&&!S.theme&&TG.colorScheme)document.documentElement.setAttribute("data-theme",TG.colorScheme);draw();syncStart();
</script>
